<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Taco Cloud - Login</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <img class="auth-logo" th:src="@{/images/TacoCloud.png}" alt="Taco Cloud"/>
        <h1>Welcome back</h1>
        <p class="auth-subtext">Log in to keep building your tacos.</p>

        <div class="auth-error" th:if="${error}">
            Unable to login. Check your username and password.
        </div>

        <form method="POST" th:action="@{/login}" id="loginForm" class="auth-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="field-group">
                <label for="username">Username</label>
                <input type="text" name="username" id="username"/>
            </div>

            <div class="field-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password"/>
            </div>

            <button type="submit" class="auth-submit">Log in</button>
        </form>

        <p class="auth-footer">New here? <a th:href="@{/register}">Create an account</a></p>
    </div>
</div>
</body>
</html>
