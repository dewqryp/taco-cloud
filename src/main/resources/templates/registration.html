<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Taco Cloud - Register</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card auth-card-wide">
        <img class="auth-logo" th:src="@{/images/TacoCloud.png}" alt="Taco Cloud"/>
        <h1>Create your account</h1>
        <p class="auth-subtext">A few details and you're ready to design tacos.</p>

        <form method="post" th:action="@{/register}" id="registerForm" class="auth-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="field-grid">
                <div class="field-group">
                    <label for="username">Username</label>
                    <input type="text" name="username" id="username"/>
                </div>
                <div class="field-group">
                    <label for="fullname">Full name</label>
                    <input type="text" name="fullname" id="fullname"/>
                </div>
            </div>

            <div class="field-grid">
                <div class="field-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password"/>
                </div>
                <div class="field-group">
                    <label for="confirm">Confirm password</label>
                    <input type="password" name="confirm" id="confirm"/>
                </div>
            </div>

            <div class="field-group">
                <label for="street">Street</label>
                <input type="text" name="street" id="street"/>
            </div>

            <div class="field-grid address-grid">
                <div class="field-group">
                    <label for="city">City</label>
                    <input type="text" name="city" id="city"/>
                </div>
                <div class="field-group">
                    <label for="state">State</label>
                    <input type="text" name="state" id="state"/>
                </div>
                <div class="field-group">
                    <label for="zip">Zip</label>
                    <input type="text" name="zip" id="zip"/>
                </div>
            </div>

            <div class="field-group">
                <label for="phone">Phone</label>
                <input type="text" name="phone" id="phone"/>
            </div>

            <button type="submit" class="auth-submit">Register</button>
        </form>

        <p class="auth-footer">Already have an account? <a th:href="@{/login}">Log in</a></p>
    </div>
</div>
</body>
</html>
